name: Release PTZ Pad
# Every push to main checks the version in package.json. If that version hasn't been
# released yet, this builds the Windows, Mac and Linux installers, publishes a GitHub
# release with the notes from CHANGELOG.md, and updates the web version on GitHub Pages.
# Every copy of PTZ Pad then shows an update notice with those notes.
# Pushes that don't change the version reach no one. Start a new version with:
#   node tools/bump.js patch   (then write the notes in CHANGELOG.md, commit, push)
# Run it by hand from the Actions tab for test installers without a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        name: Is this a new version?
        run: |
          v=$(node tools/check-version.js)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released. Nothing to publish. Run node tools/bump.js to start a new version."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$v"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ptz-pad-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Write the release notes
        run: |
          {
            node tools/release-notes.js "${{ needs.check.outputs.version }}"
            echo
            echo "## Download"
            echo "- **Windows:** \`PTZ-Pad-Setup-*.exe\` installs it. \`PTZ-Pad-Portable-*.exe\` runs without installing."
            echo "- **Mac:** the \`.dmg\`. The first time, right-click PTZ Pad and choose Open."
            echo "- **Linux:** the \`.AppImage\`. Make it executable, then run it."
            echo "- **Web version:** https://shippster.github.io/ptz-pad/ (Chrome or Edge, with PTZ Pad open on the same computer)"
            echo
            echo "The apps aren't code-signed yet, so Windows and macOS warn on first launch. Choose More info then Run anyway on Windows; right-click then Open on Mac."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PTZ Pad ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: installers/*
          make_latest: true

  web:
    needs: [check, release]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
