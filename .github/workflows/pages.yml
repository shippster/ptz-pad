name: Publish web version
# Builds the installable web version and its update feed (version.json) and publishes
# them to GitHub Pages. "Release PTZ Pad" runs this after each release, so the web
# version and the update notice always match the installers. You can also run it by hand.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
